services:
  # 1. Urban Intelligence Backend API
  - type: web
    name: urban-intelligence-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: urban-intelligence-ml-service
          property: host

  # 2. ML Detection Service
  - type: web
    name: urban-intelligence-ml-service
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install --no-cache-dir -r ml-service/requirements.txt"
    startCommand: "python -m uvicorn ml-service.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 3. Frontend UI Platform
  - type: web
    name: urban-intelligence-frontend
    env: static
    buildCommand: "cd frontend && chmod +x node_modules/.bin/* 2>/dev/null || true && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: urban-intelligence-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
